<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 인증 완료 - DMR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        .check-icon {
            width: 60px;
            height: 60px;
            background: #DC1D23;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .check-icon::after {
            content: '✓';
            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
        }

        .message {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .app-button {
            background: #DC1D23;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }

        .app-button:hover {
            background: #b91c1c;
            transform: translateY(-1px);
        }

        .footer {
            color: #9ca3af;
            font-size: 14px;
        }

        .error-icon {
            background: #ef4444;
        }

        .error-title {
            color: #dc2626;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="check-icon" id="status-icon"></div>
        <h1 class="title" id="status-title">이메일 인증 완료</h1>
        <p class="message" id="status-message">
            인증이 완료되었습니다.<br>
            이제 DMR 앱에서 로그인하실 수 있습니다.
        </p>
        <a href="#" class="app-button" onclick="closeWindow()">앱으로 돌아가기</a>
        <p class="footer">DMR 고객관리</p>
    </div>

    <script>
        function closeWindow() {
            if (window.opener) {
                window.close();
            } else {
                alert('DMR 앱을 열어서 로그인해주세요.');
            }
        }

        // URL 파라미터 확인하여 에러 처리
        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            const errorDescription = urlParams.get('error_description');

            if (error) {
                document.getElementById('status-icon').className = 'check-icon error-icon';
                document.getElementById('status-icon').innerHTML = '<span style="color: white; font-size: 30px; font-weight: bold;">✕</span>';
                document.getElementById('status-title').textContent = '인증 실패';
                document.getElementById('status-title').className = 'title error-title';
                document.getElementById('status-message').innerHTML =
                    '이메일 인증 중 문제가 발생했습니다.<br>' +
                    (errorDescription || '다시 시도해주세요.');
            }
        });
    </script>
</body>
</html>
